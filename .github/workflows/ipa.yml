name: Build Unsigned IPA

on:
    workflow_dispatch:
    push:
        branches:
            - main

jobs:
    build-ipa:
        runs-on: macos-14
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Xcode (16+, 需要 objectVersion 77)
              uses: maxim-lobanov/setup-xcode@v1
              with:
                  xcode-version: 'latest-stable'

            - name: Show toolchain
              run: |
                  xcodebuild -version
                  swift --version

            - name: Build (unsigned)
              run: |
                  set -eo pipefail
                  xcodebuild \
                    -project PakePlus.xcodeproj \
                    -scheme PakePlus \
                    -configuration Release \
                    -sdk iphoneos \
                    -destination 'generic/platform=iOS' \
                    -derivedDataPath "$RUNNER_TEMP/build" \
                    CODE_SIGN_IDENTITY="" \
                    CODE_SIGNING_REQUIRED=NO \
                    CODE_SIGNING_ALLOWED=NO \
                    build

            - name: Package IPA + 校验卡密页已编入
              run: |
                  set -eo pipefail
                  APP="$RUNNER_TEMP/build/Build/Products/Release-iphoneos/PakePlus.app"
                  if [ ! -d "$APP" ]; then
                    echo "❌ 未找到构建产物: $APP"
                    exit 1
                  fi

                  BIN="$APP/PakePlus"
                  if [ ! -f "$BIN" ]; then
                    echo "❌ 未找到主程序: $BIN"
                    exit 1
                  fi

                  echo "=== 二进制信息 ==="
                  file "$BIN"
                  lipo -info "$BIN" || true

                  echo "=== 校验卡密相关符号 ==="
                  # 说明：不要用 `strings ... | grep -q`。grep 命中后立即退出，会让 strings 收到
                  # SIGPIPE 返回非 0，配合 `set -o pipefail` 会把整条管道判为失败（误报）。
                  # 这里直接用 grep -a 扫二进制（不依赖 strings），再用 nm 兜底。
                  ensure_contains() {
                    local name="$1"
                    if grep -a -q -F -- "$name" "$BIN"; then
                      echo "✅ 找到 $name"
                      return 0
                    fi
                    if command -v nm >/dev/null 2>&1 && nm -a "$BIN" 2>/dev/null | grep -q -- "$name"; then
                      echo "✅ 找到 $name (nm)"
                      return 0
                    fi
                    echo "❌ 二进制中没有 $name，说明相关代码没有被编译进这个包"
                    return 1
                  }

                  if ! ensure_contains "CardKeyView"; then
                    echo "=== 调试：搜索 CardKeyView 附近的字符串 ==="
                    grep -a -o -E '.{0,24}CardKeyView.{0,24}' "$BIN" 2>/dev/null | head -20 || true
                    echo "请检查 CardKeyView.swift 是否加入 PakePlus target 的 Compile Sources，或被 Release 死代码剥离。"
                    echo "不要发布这个包。"
                    exit 1
                  fi
                  ensure_contains "XbLicense" || echo "⚠️ 未找到 XbLicense（非致命）"

                  echo "=== 校验 Info.plist 配置 ==="
                  /usr/libexec/PlistBuddy -c "Print :WEBURL" "$APP/Info.plist" || true
                  /usr/libexec/PlistBuddy -c "Print :DEBUG" "$APP/Info.plist" || true

                  mkdir -p Payload
                  cp -R "$APP" Payload/
                  rm -rf Payload/PakePlus.app/_CodeSignature
                  IPA="PakePlus-unsigned-${GITHUB_SHA::7}.ipa"
                  zip -qry "$IPA" Payload
                  ls -lh "$IPA"

            - name: Upload IPA Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: PakePlus-ipa
                  path: PakePlus-unsigned-*.ipa
