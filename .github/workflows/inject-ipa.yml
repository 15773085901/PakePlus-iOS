name: Inject IPA (dylib + sign)

# 通过 git / GitHub Actions 实现「IPA 一键注入」：
#   - 在 macOS Runner 上自动编译 zsign；
#   - 把卡密 dylib 注入到目标 IPA（LC_LOAD_DYLIB），并重新签名；
#   - 产物作为 Artifact 下载。
# 基础 IPA 与 dylib 可以用「下载地址」或「仓库内路径」二选一提供。
# 签名方式：
#   adhoc —— 免证书，配合 TrollStore 安装（要求基础 IPA 已解密）；
#   cert  —— 用仓库 Secrets 里的 p12 + 描述文件签名。

on:
    workflow_dispatch:
        inputs:
            ipa_url:
                description: '基础 IPA 下载地址（留空则用仓库内 ipa_path）'
                required: false
                default: ''
            ipa_path:
                description: '仓库内基础 IPA 路径（ipa_url 为空时使用）'
                required: false
                default: ''
            dylib_url:
                description: 'dylib 下载地址（留空则用仓库内 dylib_path）'
                required: false
                default: ''
            dylib_path:
                description: '仓库内 dylib 路径（dylib_url 为空时使用）'
                required: false
                default: ''
            sign_mode:
                description: '签名方式：adhoc 或 cert'
                required: true
                default: 'adhoc'
            out_name:
                description: '输出 IPA 文件名'
                required: true
                default: 'injected.ipa'
            bundle_id:
                description: '可选：修改 Bundle ID（cert 签名时常用）'
                required: false
                default: ''

jobs:
    inject:
        runs-on: macos-14
        timeout-minutes: 40
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Prepare inputs
              run: |
                  set -eo pipefail
                  if [ -n "${{ inputs.ipa_url }}" ]; then
                    echo "下载基础 IPA: ${{ inputs.ipa_url }}"
                    curl -fL --retry 3 -o "$RUNNER_TEMP/base.ipa" "${{ inputs.ipa_url }}"
                    echo "IPA=$RUNNER_TEMP/base.ipa" >> "$GITHUB_ENV"
                  else
                    if [ ! -f "${{ inputs.ipa_path }}" ]; then
                      echo "::error::缺少基础 IPA：ipa_url 为空且 ipa_path 不存在（${{ inputs.ipa_path }}）"; exit 1
                    fi
                    echo "IPA=${{ inputs.ipa_path }}" >> "$GITHUB_ENV"
                  fi

                  if [ -n "${{ inputs.dylib_url }}" ]; then
                    echo "下载 dylib: ${{ inputs.dylib_url }}"
                    curl -fL --retry 3 -o "$RUNNER_TEMP/libkami.dylib" "${{ inputs.dylib_url }}"
                    echo "DYLIB=$RUNNER_TEMP/libkami.dylib" >> "$GITHUB_ENV"
                  else
                    if [ ! -f "${{ inputs.dylib_path }}" ]; then
                      echo "::error::缺少 dylib：dylib_url 为空且 dylib_path 不存在（${{ inputs.dylib_path }}）"; exit 1
                    fi
                    echo "DYLIB=${{ inputs.dylib_path }}" >> "$GITHUB_ENV"
                  fi

                  file "$IPA" || true
                  file "$DYLIB" || true

            - name: Build zsign
              run: |
                  set -eo pipefail
                  brew install pkg-config openssl || true
                  export PKG_CONFIG_PATH="$(brew --prefix openssl)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
                  export CFLAGS="-I$(brew --prefix openssl)/include ${CFLAGS:-}"
                  export LDFLAGS="-L$(brew --prefix openssl)/lib ${LDFLAGS:-}"
                  git clone --depth=1 https://github.com/zhlynn/zsign.git "$RUNNER_TEMP/zsign"
                  cd "$RUNNER_TEMP/zsign/build/macos"
                  make clean && make -j"$(sysctl -n hw.ncpu)"
                  if [ ! -x zsign ]; then echo "::error::zsign 编译失败"; exit 1; fi
                  echo "ZSIGN=$RUNNER_TEMP/zsign/build/macos/zsign" >> "$GITHUB_ENV"

            - name: Inject dylib + ad-hoc sign (TrollStore)
              if: inputs.sign_mode == 'adhoc'
              run: |
                  set -eo pipefail
                  EXTRA=""
                  if [ -n "${{ inputs.bundle_id }}" ]; then EXTRA="-b ${{ inputs.bundle_id }}"; fi
                  "$ZSIGN" -a $EXTRA -l "$DYLIB" -o "${{ inputs.out_name }}" "$IPA"
                  ls -lh "${{ inputs.out_name }}"

            - name: Inject dylib + cert sign
              if: inputs.sign_mode == 'cert'
              env:
                  IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
                  IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
                  IOS_PROVISION_BASE64: ${{ secrets.IOS_PROVISION_BASE64 }}
              run: |
                  set -eo pipefail
                  if [ -z "${IOS_P12_BASE64:-}" ] || [ -z "${IOS_PROVISION_BASE64:-}" ]; then
                    echo "::error::cert 模式需要在仓库 Secrets 配置 IOS_P12_BASE64 / IOS_P12_PASSWORD / IOS_PROVISION_BASE64"; exit 1
                  fi
                  echo "$IOS_P12_BASE64" | base64 -D > "$RUNNER_TEMP/cert.p12"
                  echo "$IOS_PROVISION_BASE64" | base64 -D > "$RUNNER_TEMP/app.mobileprovision"
                  EXTRA=""
                  if [ -n "${{ inputs.bundle_id }}" ]; then EXTRA="-b ${{ inputs.bundle_id }}"; fi
                  "$ZSIGN" -k "$RUNNER_TEMP/cert.p12" -p "$IOS_P12_PASSWORD" \
                    -m "$RUNNER_TEMP/app.mobileprovision" $EXTRA \
                    -l "$DYLIB" -o "${{ inputs.out_name }}" "$IPA"
                  ls -lh "${{ inputs.out_name }}"

            - name: Upload injected IPA
              uses: actions/upload-artifact@v4
              with:
                  name: injected-ipa
                  path: ${{ inputs.out_name }}
